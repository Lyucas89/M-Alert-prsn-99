name: muse-monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controlla biglietti
        run: python monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EVENT_URLS: ${{ secrets.EVENT_URLS }}
          EMPTY_MARKERS: ${{ secrets.EMPTY_MARKERS }}
      - name: Salva stato
        run: |
          git config user.name "muse-bot"
          git config user.email "muse-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "aggiorna stato" && git push)
